<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <!-- ADAPTA LA WEB AL CELULAR -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flakko Tattoo</title>

    <link rel="stylesheet" href="estilo.css">

    <!-- FUENTE -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500&display=swap" rel="stylesheet">
</head>

<body>
<section class="hero"></section>
    <!-- MENU -->
    <nav>
        <a href="#galeria">Galería</a>
        <a href="#consultas">Consultas</a>
    </nav>

    <!-- GALERIA -->
    <section id="galeria" class="galeria">

        <h2>Galería</h2>

        <div class="grid">

            <img src="tattM.jpeg" alt="Trabajo 1">

            <img src="tattoGTO.jpeg" alt="Trabajo 2">

            <img src="tattoA.jpeg" alt="Trabajo 3">

            <img src="tattO.jpeg" alt="Trabajo 4">

            <img src="tattCR.jpeg" alt="Trabajo 5">

        </div>

    </section>

    <!-- INFO -->
    <section class="info">

        <h2>¿Por qué elegir nuestro estudio?</h2>

        <ul>
            <li>Ofrecemos diseños personalizados</li>
            <li>Realizamos cotizaciones gratuitas</li>
            <li>Brindamos servicios de calidad</li>
            <li>Mostramos arte único en cada trabajo</li>
        </ul>

    </section>

    <!-- CONSULTAS -->
    <section id="consultas" class="consultas">

        <div class="contenedor">

            <div class="texto">

                <h3>¿Estás pensando en tu próximo tattoo?</h3>

                <p>Nosotros te ayudamos...</p>

                <form>

                    <label for="nombre">Nombre:</label>

                    <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre">

                    <label for="telefono">Teléfono:</label>

                    <input type="text" id="telefono" name="telefono" placeholder="Ingrese su teléfono">

                    <label for="parte-cuerpo">Parte del cuerpo:</label>

                    <input type="text" id="parte-cuerpo" name="parte-cuerpo"
                        placeholder="Parte del cuerpo a tatuar">

                    <label for="descripcion">Describí tu idea:</label>

                    <textarea id="descripcion"
                        placeholder="Descripción de tu idea"></textarea>

                    <input type="submit" value="Solicitar Cotización" class="btn-enviar">

                </form>

            </div>

        </div>

    </section>

</body>

</html>
